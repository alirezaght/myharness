[project]
name = "harness"
version = "0.1.0"
description = "AL Engineering Harness — spec-driven requirements discovery, design approval and AL supervision for Claude Code"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 100
# al/ is the vendored AL orchestrator package; it keeps its own style.
extend-exclude = ["al"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: headless-Chrome end-to-end checks, run by the browser workflow"]
