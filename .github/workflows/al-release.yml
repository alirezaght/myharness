name: AL release verification

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Successor preparation exercises the supported macOS process sandbox.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install pytest 'jsonschema>=4,<5'
      - name: Verify installer, platform suites, and release payload
        run: python al/release_verify.py --full
      - name: Run the pre-release acceptance tier (long end-to-end proofs)
        run: python al/release_verify.py --tier acceptance
